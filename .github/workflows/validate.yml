name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python3 -m py_compile skills/fcs-rename/scripts/*.py
      - name: Run safety tests
        run: python3 -m unittest discover -s tests -v
